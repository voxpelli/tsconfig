name: Test External

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retestFailures:
        description: 'Re-test failures'
        type: boolean
      tsVersion:
        description: 'TS version for dependents-canary tiers 1-2 (default: 7.0)'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: voxpelli/ghatemplates/.github/workflows/lint.yml@main
  read_external_projects:
    needs: lint
    name: Read list of projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        # Typed `inputs` context: a real boolean on dispatch, empty (falsy) on
        # push/PR — the legacy github.event.inputs form is a string, where
        # even "false" is truthy and every dispatch would retest failures.
        run: echo "matrix=$(jq -c '${{ inputs.retestFailures && '[.[].[]]' || '.' }}' dependents-data/${{ inputs.retestFailures && 'failures.json' || 'joined.json' }})" >> $GITHUB_OUTPUT
  test_external:
    needs: read_external_projects
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [lts/*]
        project: ${{ fromJson(needs.read_external_projects.outputs.matrix) }}
    steps:
      - name: Checkout main project
        uses: actions/checkout@v6
        with:
          path: main
      - name: Checkout ${{ matrix.project }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.project }}
          path: project

      - name: ensure project is still using this config
        run: cat tsconfig.json| grep \"@voxpelli/tsconfig
        working-directory: ./project

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      # No install of ./main needed: the config swap below points `extends`
      # at plain ../main/*.json files.
      - name: install project
        run: '[ -f package-lock.json ] && npm ci --ignore-scripts --force || npm install --ignore-scripts --force'
        working-directory: ./project

      - name: build project if needed
        run: npm run build-for-test --if-present
        working-directory: ./project

      - name: modify project config
        run: sed 's/"@voxpelli\/tsconfig\//"..\/main\//g' tsconfig.json > tmp.tsconfig.json && rm tsconfig.json && mv tmp.tsconfig.json tsconfig.json
        working-directory: ./project
      - name: show modified config
        run: cat tsconfig.json && ! grep '@voxpelli/tsconfig' tsconfig.json
        working-directory: ./project

      # Escalating type-check: plain TS 7 -> TS 7 via the compat aliases from
      # the README migration guide -> TS 6. Green if any tier passes; red only
      # if the project fails even under TS 6 (a genuine regression). The
      # achieved tier lands in the step output `tier` and the run's step
      # summary, so per-project ecosystem progress stays visible over time.
      - name: Tiered type-check
        id: tiers
        run: bash ../main/.github/scripts/tiered-tsc.sh
        working-directory: ./project
        env:
          PROJECT_NAME: ${{ matrix.project }}
          TIER1_TS: ${{ inputs.tsVersion || '7.0' }}
  test_self:
    needs: lint
    name: Validate configs (TS ${{ matrix.ts_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The TypeScript majors this package supports. In TS 7 the `tsc`
        # binary is the native (Go) compiler, so this also covers tsgo.
        ts_version: ['6.0', '7.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --ignore-scripts
      - run: npm install --no-save typescript@${{ matrix.ts_version }}
      - run: node node_modules/typescript/bin/tsc --version
      - name: Type-check every preset against the test stub
        # Each user-facing preset is validated the same way the root
        # tsconfig.json self-tests: extend it and point it at test.js.
        # The `*-bare` bases and base-jsdoc are skipped on purpose — they
        # set no allowJs/noEmit, so on their own tsc finds no inputs.
        run: |
          set -e
          for preset in base base-node-jsdoc base-browser-jsdoc nodenext browser node14 node16 node18 node20 node22 node24 node26; do
            echo "== ${preset} =="
            printf '{"extends":"./%s.json","files":["test.js"]}' "${preset}" > "tmp.${preset}.tsconfig.json"
            node node_modules/typescript/bin/tsc -p "tmp.${preset}.tsconfig.json"
            rm "tmp.${preset}.tsconfig.json"
          done
  test_external_completed:
    needs:
      - test_external
      - test_self
    name: Tests completed
    runs-on: ubuntu-latest
    # A skipped job would satisfy required status checks, so this gate must
    # always run and assert its dependencies' results explicitly.
    if: always()
    steps:
    - name: Assert all tests passed
      run: |
        [ "${{ needs.test_external.result }}" = "success" ] || { echo "test_external: ${{ needs.test_external.result }}"; exit 1; }
        [ "${{ needs.test_self.result }}" = "success" ] || { echo "test_self: ${{ needs.test_self.result }}"; exit 1; }
        echo Success!
