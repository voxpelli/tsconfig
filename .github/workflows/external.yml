name: Test External

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retestFailures:
        description: 'Re-test failures'
        type: boolean
      tsVersion:
        description: 'Use TS version'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: voxpelli/ghatemplates/.github/workflows/lint.yml@main
  read_external_projects:
    needs: lint
    name: Read list of projects
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: echo "matrix=$(jq -c '${{ github.event.inputs.retestFailures && '[.[].[]]' || '.' }}' dependents-data/${{ github.event.inputs.retestFailures && 'failures.json' || 'joined.json' }})" >> $GITHUB_OUTPUT
  test_external:
    needs: read_external_projects
    name: Test ${{ matrix.project }} (TS ${{ matrix.ts_version }})
    runs-on: ubuntu-latest
    # The TS 7 leg is informational: much of the ecosystem (typescript-eslint,
    # type-coverage, …) can't run under TS 7 until it ships a compiler API
    # (expected in 7.1), so dependents that pull those in will fail on `tsc`
    # here through no fault of this config. Keep it visible but non-blocking;
    # the TS 6.0 leg is the real regression gate.
    continue-on-error: ${{ matrix.ts_version == '7.0' }}
    strategy:
      fail-fast: false
      matrix:
        node_version: [lts/*]
        ts_version: ['6.0', '7.0']
        project: ${{ fromJson(needs.read_external_projects.outputs.matrix) }}
    steps:
      - name: Checkout main project
        uses: actions/checkout@v6
        with:
          path: main
      - name: Checkout ${{ matrix.project }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.project }}
          path: project

      - name: ensure project is still using this config
        run: cat tsconfig.json| grep \"@voxpelli/tsconfig
        working-directory: ./project

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - name: install main
        run: '[ -f package-lock.json ] && npm ci --ignore-scripts --force || npm install --ignore-scripts --force'
        working-directory: ./main
      - name: install project
        run: '[ -f package-lock.json ] && npm ci --ignore-scripts --force || npm install --ignore-scripts --force'
        working-directory: ./project

      - name: Get source TS version
        id: source-ts
        run: echo "TS_VERSION=$(npx tsc --version | sed s/Version\ //)" >> $GITHUB_OUTPUT
        working-directory: ./project
      - name: Get target TS version
        id: target-ts
        run: echo "TS_VERSION=${{ github.event.inputs.tsVersion || matrix.ts_version }}" >> $GITHUB_OUTPUT
        working-directory: ./main

      - name: replace typescript version ${{ steps.source-ts.outputs.TS_VERSION }} with ${{ steps.target-ts.outputs.TS_VERSION }}
        if: steps.source-ts.outputs.TS_VERSION != steps.target-ts.outputs.TS_VERSION
        run: npm install --force typescript@${{ steps.target-ts.outputs.TS_VERSION }}
        working-directory: ./project

      - name: show installed typescript version
        run: npx tsc --version
        working-directory: ./project

      - name: build project if needed
        run: npm run build-for-test --if-present
        working-directory: ./project

      - name: modify project config
        run: sed 's/"@voxpelli\/tsconfig\//"..\/main\//' tsconfig.json > tmp.tsconfig.json && rm tsconfig.json && mv tmp.tsconfig.json tsconfig.json
        working-directory: ./project
      - name: show modified config
        run: cat tsconfig.json
        working-directory: ./project

      - run: npx tsc
        working-directory: ./project
  test_self:
    needs: lint
    name: Validate configs (TS ${{ matrix.ts_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The TypeScript majors this package supports. In TS 7 the `tsc`
        # binary is the native (Go) compiler, so this also covers tsgo.
        ts_version: ['6.0', '7.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --ignore-scripts
      - run: npm install --no-save typescript@${{ matrix.ts_version }}
      - run: npx tsc --version
      - name: Type-check every preset against the test stub
        # Each user-facing preset is validated the same way the root
        # tsconfig.json self-tests: extend it and point it at test.js.
        # The `*-bare` bases and base-jsdoc are skipped on purpose — they
        # set no allowJs/noEmit, so on their own tsc finds no inputs.
        run: |
          set -e
          for preset in base base-node-jsdoc base-browser-jsdoc nodenext browser node14 node16 node18 node20 node22 node24 node26; do
            echo "== ${preset} =="
            printf '{"extends":"./%s.json","files":["test.js"]}' "${preset}" > "tmp.${preset}.tsconfig.json"
            npx tsc -p "tmp.${preset}.tsconfig.json"
            rm "tmp.${preset}.tsconfig.json"
          done
  test_external_completed:
    needs: test_external
    name: Tests completed
    runs-on: ubuntu-latest
    steps:
    - run: echo Success!
